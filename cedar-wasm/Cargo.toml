[package]
name = "jetbrains-cedar-wasm"

version = "0.10.6"
edition = "2021"
description = "JVM (Chicory) bindings for cedar-policy 4.13.0, semported from vscode-cedar-wasm"
license = "Apache-2.0"
homepage = "https://cedarpolicy.com"
repository = "https://github.com/TheFellow/jetbrains-cedar"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# cedar
cedar-policy = { version = "=4.13.0" }
cedar-policy-core = { version = "=4.13.0" }
cedar-policy-formatter = { version = "=4.13.0" }
miette = "7.6.0"

[build-dependencies]
toml = "0.8"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
lto = true
codegen-units = 1
