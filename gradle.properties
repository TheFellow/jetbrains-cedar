pluginGroup = io.github.thefellow.cedar
pluginName = Cedar
pluginVersion = 0.10.6.5

# Plugin compatibility. 262 = 2026.2 (the platform runs on Java 25).
pluginSinceBuild = 262

# IDE used to compile, test and `runIde`: the oldest release we support (pluginSinceBuild). Don't compile
# against a newer one: its bytecode may not link on older IDEs (2026.3 added FileEditorManager.Companion, so
# FileEditorManager.getInstance compiled against it fails on 2026.2).
platformType = GO
platformVersion = 2026.2.3
# Newer releases (comma-separated) the Plugin Verifier also checks, reporting deprecated/experimental API use.
platformVerifyVersions = 2026.3
# An installed IDE: `runLocalIde` runs the plugin in it, `verifyPlugin -PverifyLocalOnly` verifies against it only.
platformLocalPath = /Applications/GoLand.app

# Cargo executable used to build the Cedar wasm module (cedar-wasm/).
cargo = cargo

kotlin.stdlib.default.dependency = false
org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx2g
