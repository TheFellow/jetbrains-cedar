pluginGroup = io.github.thefellow.cedar
pluginName = Cedar
pluginVersion = 0.10.6.2

# Plugin compatibility. 262 = 2026.2 (the platform runs on Java 25).
pluginSinceBuild = 262

# Target IDE used to compile, test and `runIde`. GoLand by default.
platformType = GO
platformVersion = 2026.2.3
# When this path exists it is used instead of downloading the IDE above.
platformLocalPath = /Applications/GoLand.app

# Cargo executable used to build the Cedar wasm module (cedar-wasm/).
cargo = cargo

kotlin.stdlib.default.dependency = false
org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx2g
